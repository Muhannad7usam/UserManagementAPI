name: Build and smoke test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Compile API
        run: dotnet build UserManagementAPI/UserManagementAPI.csproj --configuration Release
      - name: Test CRUD, validation, errors and middleware
        shell: bash
        run: |
          set -euo pipefail
          export ApiSecurity__ApiKey='test-ci-secret-not-for-production'
          export ASPNETCORE_URLS='http://127.0.0.1:5100'
          dotnet run --project UserManagementAPI/UserManagementAPI.csproj --no-launch-profile --no-build --configuration Release > /tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/api.log' EXIT
          python3 tests/smoke_test.py --base-url http://127.0.0.1:5100 --api-key "$ApiSecurity__ApiKey"
